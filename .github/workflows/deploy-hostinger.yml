name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by Supabase when a blog or page SEO is saved in /admin (see supabase/auto-publish.sql)
  repository_dispatch:
    types: [content-updated]
  # Daily safety net in case a trigger was missed
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      DEPLOY_TARGET: hostinger # static export into out/ (Vercel builds itself and ignores this workflow)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so sitemap lastmod dates are real

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:hostinger

      # Deploy only once FTP credentials are configured in repo secrets
      - name: Upload to Hostinger via FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}

      - name: Skip deploy notice
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP secrets not set — site built but not deployed to Hostinger."
